<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalite Doküman Merkezi</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #f8fafc; color: #1e3a8a; padding: 1.5rem;
  }
  main {
    max-width: 28rem; text-align: center; border: 1px solid #dbeafe;
    border-radius: 0.75rem; background: #fff; padding: 2rem 1.5rem;
  }
  h1 { font-size: 1.125rem; margin: 0 0 0.75rem; }
  p { margin: 0 0 1rem; font-size: 0.875rem; line-height: 1.5; color: #475569; }
  a {
    display: inline-block; padding: 0.625rem 1.25rem; border-radius: 0.5rem;
    background: #d97706; color: #fff; text-decoration: none; font-weight: 600;
  }
  code { font-size: 0.75rem; background: #e9eef6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    main { background: #131c2e; border-color: #243352; }
    p { color: #94a3b8; }
    code { background: #1c2942; }
  }
</style>
</head>
<body>
<main>
  <h1>Kalite Doküman Merkezi</h1>
  <p>
    Web arayüzü bu adreste değil. Excel motoru çalışıyor;
    arayüz için Next.js sunucusunu açın.
  </p>
  <p><code>python calistir.py</code></p>
  <p><a href="http://localhost:3000">http://localhost:3000</a></p>
</main>
<script>
  if (location.port === "8000") {
    setTimeout(function () { location.href = "http://localhost:3000"; }, 1200);
  }
</script>
</body>
</html>
